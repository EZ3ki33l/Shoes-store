services:
  atchaussures:
    build:
      context: .
      args:
        # Uniquement utilisé pendant le build pour `prisma generate` (pas de connexion réelle requise)
        DATABASE_URL: ${DATABASE_URL:-postgresql://build:build@localhost:5432/build}
    image: atchaussures:latest
    container_name: atchaussures
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # Port local (non exposé publiquement) : Nginx installé sur l'hôte
      # fait le reverse proxy vers ce port, comme pour les autres sites
      # (voir /etc/nginx/sites-available/).
      - '127.0.0.1:3001:3000'
