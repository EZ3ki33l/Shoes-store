services:
  atchaussures:
    build:
      context: .
      args:
        # Uniquement utilisé pendant le build pour `prisma generate` (pas de connexion réelle requise)
        DATABASE_URL: ${DATABASE_URL:-postgresql://build:build@localhost:5432/build}
    image: atchaussures:latest
    container_name: atchaussures
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      VIRTUAL_HOST: atchaussures.ez3ki33l.ovh
      VIRTUAL_PORT: '3000'
      LETSENCRYPT_HOST: atchaussures.ez3ki33l.ovh
      LETSENCRYPT_EMAIL: r.rousset31@gmail.com
    expose:
      - '3000'
    networks:
      - nginx-proxy

networks:
  # Nom du réseau Docker externe déjà utilisé par nginx-proxy / acme-companion
  # sur le serveur. Vérifier avec `docker network ls` et ajuster si besoin.
  nginx-proxy:
    external: true
